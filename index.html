<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://fonts.googleapis.com/css?family=Droid+Sans' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@bmlt-enabled/croutonjs/crouton.min.css" />
<!--    <link href="map.css" rel="stylesheet" type="text/css" />-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Droid Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto 3rem;
            text-align: center;
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .stat-item {
            font-size: 1rem;
            color: #4a5568;
            padding: 0.5rem 1rem;
            background: #f7fafc;
            border-radius: 8px;
            font-weight: 500;
        }

        .day-navigation {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .day-navigation a {
            padding: 0.625rem 1.25rem;
            background: #f7fafc;
            color: #4a5568;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
        }

        .day-navigation a:hover {
            background: #3182ce;
            color: white;
            border-color: #3182ce;
            transform: translateY(-1px);
            box-shadow: 0 2px 4px rgba(49, 130, 206, 0.2);
        }

        .day-navigation a:active {
            transform: translateY(0);
        }

        .filter-toggles {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .toggle-btn {
            padding: 0.625rem 1.25rem;
            background: #f7fafc;
            color: #4a5568;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .toggle-btn:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .toggle-btn.active {
            background: #3182ce;
            color: white;
            border-color: #3182ce;
            box-shadow: 0 2px 4px rgba(49, 130, 206, 0.2);
        }

        .toggle-btn.active:hover {
            background: #2b6cb0;
            border-color: #2b6cb0;
        }

        #bmlt-tabs {
            max-width: 1200px;
            margin: 0 auto;
        }

        .lds-css {
            margin: 2rem auto;
        }

        .bmlt-column4 > #share-button {
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .header-container {
                padding: 2rem 1.5rem;
            }

            .stats-container {
                gap: 1rem;
            }

            .day-navigation {
                gap: 0.4rem;
            }

            .day-navigation a {
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.5rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            .header-container {
                padding: 1.5rem 1rem;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
<div class="header-container">
    <h1>Meetings in <span id="province-title">New Jersey</span></h1>
    <div class="stats-container">
        <span id="meeting-count" class="stat-item"></span>
        <span id="group-count" class="stat-item"></span>
    </div>
    <div class="day-navigation">
        <a href="/">All Days</a>
        <a href="/?day=1">Sunday</a>
        <a href="/?day=2">Monday</a>
        <a href="/?day=3">Tuesday</a>
        <a href="/?day=4">Wednesday</a>
        <a href="/?day=5">Thursday</a>
        <a href="/?day=6">Friday</a>
        <a href="/?day=7">Saturday</a>
    </div>
    <div class="filter-toggles">
        <button id="upcoming-toggle" class="toggle-btn">Upcoming Only</button>
    </div>
</div>
<div class="lds-css ng-scope"><div class="lds-ellipsis"><div><div></div></div><div><div></div></div><div><div></div></div><div><div></div></div><div><div></div></div></div></div>
<div id="bmlt-tabs"></div>
</body>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@bmlt-enabled/croutonjs/crouton.min.js"></script>
<script type="text/javascript">
    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    function getDayOfTheWeek() {
        return getUrlParameter("day") !== "" ? "&weekdays=" + getUrlParameter("day") : ""
    }

    var crouton = new Crouton({
        "root_server": "https://tomato.bmltenabled.org/main_server/",
        "show_map": true,
        "google_api_key": "AIzaSyBZLdfzGAie2IjuZl5laYZMjaEtuFnmd-o",
        "template_path": "https://cdn.jsdelivr.net/npm/@bmlt-enabled/croutonjs/templates",
        "has_areas": true,
        "default_filter_dropdown": "venues=in-person",
        "button_filters": [
            {'title': 'City', 'field': 'location_municipality'},
        ],
        "custom_query": "&services=-490&recursive=1&meeting_key=location_province&meeting_key_value=NJ" + getDayOfTheWeek(),  // filtering out Western Australia by excluding all of that region.
        "language": getUrlParameter('language') === "" ? "en-US" : getUrlParameter('language'),
        "theme": "florida-nights",
        "filter_tabs": true,
        "clustering": 1,
        "on_complete": function() {
            jQuery(".lds-css").hide();
        },
        "metadata_template": [
            "{{#isVirtualOrHybrid this}}",
            "    {{#isHybrid this}}",
            "        <div class='meetsVirtually'><span class='glyphicon glyphicon-cloud-upload'></span> {{meetsHybrid this}}</div>",
            "    {{else}}",
            "        <div class='meetsVirtually'><span class='glyphicon glyphicon-cloud'></span> {{meetsVirtually this}}</div>",
            "    {{/isHybrid}}",
            "    {{#if this.virtual_meeting_link}}",
            "        <div><span class='glyphicon glyphicon-globe'></span> {{webLinkify this.virtual_meeting_link}}</div>",
            "        {{#if this.show_qrcode}}",
            "            <div class='qrcode'>{{qrCode this.virtual_meeting_link}}</div>",
            "        {{/if}}",
            "    {{/if}}",
            "    {{#if this.phone_meeting_number}}",
            "        <div><span class='glyphicon glyphicon-earphone'></span> {{phoneLinkify this.phone_meeting_number}}</div>",
            "        {{#if this.show_qrcode}}",
            "            <div class='qrcode'>{{qrCode this.phone_meeting_number}}</div>",
            "        {{/if}}",
            "    {{/if}}",
            "{{/isVirtualOrHybrid}}",
            "{{#isNotTemporarilyClosed this}}",
            "    {{#unless (hasFormats 'VM' this)}}",
            "        <div>",
            "            <a id='map-button' class='btn btn-primary btn-xs'",
            "                href='https://www.google.com/maps/search/?api=1&query={{this.latitude}},{{this.longitude}}&q={{this.latitude}},{{this.longitude}}'",
            "                target='_blank' rel='noopener noreferrer'>",
            "                <span class='glyphicon glyphicon-map-marker'></span> {{this.map_word}}</a>",
            "        </div>",
            "        <div class='geo hide'>{{this.latitude}},{{this.longitude}}</div>",
            "    {{/unless}}",
            "{{/isNotTemporarilyClosed}}",
            "<a href=\"javascript:void(0);\" id=\"share-button\" class=\"btn btn-primary btn-xs\" onClick=\"navigator.share({ text: '{{this.formatted_day}} {{this.start_time_formatted}} - {{this.end_time_formatted}} {{this.meeting_name}} {{this.location_text}} {{this.formatted_address}} {{this.formatted_location_info}}{{#if this.virtual_meeting_additional_info}} {{this.virtual_meeting_additional_info}}{{/if}}', url: '{{#isVirtualOrHybrid this}}{{#if this.virtual_meeting_link}}{{this.virtual_meeting_link}}{{/if}}{{#if this.phone_meeting_number}}{{this.phone_meeting_number}}{{/if}}{{/isVirtualOrHybrid}}{{#isInPersonOrHybrid this}} https://www.google.com/maps/search/?api=1&amp;query={{this.latitude}},{{this.longitude}}&amp;q={{this.latitude}},{{this.longitude}}{{/isInPersonOrHybrid}}'})\"><span class=\"glyphicon glyphicon-share\"></span> {{this.share_word}}</a>",
            "</td><td class='bmlt-column4'><div><i>{{this.serviceBodyName}}<br>{{webLinkify this.serviceBodyUrl}}<br>{{phoneLinkify this.serviceBodyPhone}}</i></div>"
        ].join('\n')
    });
    document.getElementById("province-title").innerText = getUrlParameter('province_name');
    crouton.render();
    crouton.meetingCount(function(res) {
        document.getElementById("meeting-count").innerHTML = "Meetings: " + res;
    });
    crouton.groupCount(function(res) {
        document.getElementById("group-count").innerHTML = "Groups: " + res;
    });
    jQuery("#paper_schedule").click(function() {
        window.open('https://demo.bmlt.app/?current-meeting-list=5&querystring_custom_1=New%20Jersey&custom_query=%26meeting_key%3Dlocation_province%26meeting_key_value%3DNJ', '_blank');
    });

    // Upcoming meetings filter
    var upcomingFilterActive = false;
    var upcomingToggle = document.getElementById('upcoming-toggle');

    function getTodayDayNumber() {
        // BMLT uses 1=Sunday, 2=Monday, etc.
        var jsDay = new Date().getDay(); // 0=Sunday, 1=Monday, etc.
        return jsDay + 1; // Convert to BMLT format
    }

    function getCurrentMinutes() {
        var now = new Date();
        return now.getHours() * 60 + now.getMinutes();
    }

    function parseTimeToMinutes(timeStr) {
        // Parse time strings like "7:00 PM", "10:30 AM", "19:00"
        if (!timeStr) return null;

        timeStr = timeStr.trim().toUpperCase();
        var hours, minutes;

        // Check for AM/PM format
        var isPM = timeStr.includes('PM');
        var isAM = timeStr.includes('AM');

        // Remove AM/PM
        timeStr = timeStr.replace(/\s*(AM|PM)/i, '');

        var parts = timeStr.split(':');
        hours = parseInt(parts[0], 10);
        minutes = parseInt(parts[1], 10) || 0;

        if (isPM && hours !== 12) {
            hours += 12;
        } else if (isAM && hours === 12) {
            hours = 0;
        }

        return hours * 60 + minutes;
    }

    function filterUpcomingMeetings() {
        var selectedDay = getUrlParameter('day');
        var todayDayNumber = getTodayDayNumber();
        var currentMinutes = getCurrentMinutes();

        // Get all meeting rows
        var meetingRows = document.querySelectorAll('.bmlt-data-row');

        meetingRows.forEach(function(row) {
            if (!upcomingFilterActive) {
                row.style.display = '';
                return;
            }

            // Get the day tab this meeting belongs to
            var parentTable = row.closest('.bmlt-table');
            var tabPanel = parentTable ? parentTable.closest('[id^="bmlt-table-"]') : null;
            var meetingDayNumber = null;

            if (tabPanel) {
                // Extract day number from tab panel id (e.g., "bmlt-table-1" for Sunday)
                var match = tabPanel.id.match(/bmlt-table-(\d+)/);
                if (match) {
                    meetingDayNumber = parseInt(match[1], 10);
                }
            }

            // If viewing a specific day via URL param, use that
            if (selectedDay !== '') {
                meetingDayNumber = parseInt(selectedDay, 10);
            }

            // Only filter if this is today's meeting
            if (meetingDayNumber !== todayDayNumber) {
                row.style.display = '';
                return;
            }

            // Find the time cell (usually first column with time data)
            var timeCell = row.querySelector('.bmlt-column0');
            if (!timeCell) {
                row.style.display = '';
                return;
            }

            var timeText = timeCell.textContent || timeCell.innerText;
            var meetingMinutes = parseTimeToMinutes(timeText);

            if (meetingMinutes === null) {
                row.style.display = '';
                return;
            }

            // Hide if meeting time has passed
            if (meetingMinutes < currentMinutes) {
                row.style.display = 'none';
            } else {
                row.style.display = '';
            }
        });
    }

    upcomingToggle.addEventListener('click', function() {
        upcomingFilterActive = !upcomingFilterActive;
        this.classList.toggle('active', upcomingFilterActive);
        filterUpcomingMeetings();
    });

    // Re-run filter when Crouton finishes rendering
    var originalOnComplete = crouton.config.on_complete;
    crouton.config.on_complete = function() {
        if (originalOnComplete) originalOnComplete();
        if (upcomingFilterActive) {
            filterUpcomingMeetings();
        }
    };
</script>
</html>
